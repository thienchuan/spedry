<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#acc6e9"/>
      <stop offset="100%" stop-color="#5b87c5"/>
    </linearGradient>
  </defs>
  <!-- Rounded container -->
  <rect width="32" height="32" rx="8" fill="url(#sg)"/>
  <!-- S-gate mark: two arcs forming S with gate cuts -->
  <!-- Top arc (inflow channel) -->
  <path d="M20 8.5C20 8.5 12 8.5 12 12.5C12 16.5 20 16 20 16" stroke="#0a1525" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Bottom arc (outflow channel) -->
  <path d="M12 16C12 16 20 15.5 20 19.5C20 23.5 12 23.5 12 23.5" stroke="#0a1525" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Gate line top -->
  <line x1="9" y1="11" x2="23" y2="11" stroke="#0a1525" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <!-- Gate line bottom -->
  <line x1="9" y1="21" x2="23" y2="21" stroke="#0a1525" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
</svg>
